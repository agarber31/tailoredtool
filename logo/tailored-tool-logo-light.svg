<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b6cff"/>
      <stop offset="100%" stop-color="#4fd8e8"/>
    </linearGradient>
  </defs>

  <!-- Mark: two interlocking T strokes forming a precise geometric monogram -->
  <g>
    <rect x="20" y="24" width="72" height="16" rx="4" fill="url(#tg)"/>
    <rect x="48" y="24" width="16" height="72" rx="4" fill="url(#tg)"/>
    <rect x="64" y="56" width="40" height="14" rx="4" fill="#4fd8e8" opacity="0.9"/>
    <rect x="76" y="56" width="14" height="40" rx="4" fill="#4fd8e8" opacity="0.9"/>
  </g>

  <!-- Wordmark -->
  <text x="136" y="76" font-family="Inter, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-1.5" fill="#101017">Tailored Tool</text>
</svg>
